# OneQode Theme Switcher Configuration
# =====================================

# Switching mode: "solar" or "fixed"
# - solar: Uses sunrise/sunset based on location
# - fixed: Uses fixed times (DAY_START and NIGHT_START)
MODE=solar

# Location for solar mode (latitude, longitude, timezone)
# Default: Sydney, Australia
LATITUDE=-33.8688
LONGITUDE=151.2093
TIMEZONE=Australia/Sydney

# Fixed-time fallback (used if MODE=fixed or astral fails)
# Format: HH:MM (24-hour)
DAY_START=07:30
NIGHT_START=18:30

# Offset minutes after sunrise/sunset before switching (solar mode)
# Positive = delay switch, Negative = switch earlier
SUNRISE_OFFSET=0
SUNSET_OFFSET=0

# Theme package IDs
LIGHT_THEME=org.oneqode.lightglass
DARK_THEME=org.oneqode.nightride

# Enable debug logging (true/false)
DEBUG=false
